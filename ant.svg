<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" role="img" aria-label="안전모를 쓰고 나뭇잎을 나르는 열심히 일하는 개미 만화">
  <style>
    .antennae { transform-box: fill-box; transform-origin: 50% 100%; animation: wiggle 1.2s ease-in-out infinite; }
    .sweat    { animation: drip 1.6s ease-in infinite; }
    .leaf     { transform-box: fill-box; transform-origin: 50% 50%; animation: sway 1.6s ease-in-out infinite; }
    @keyframes wiggle { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes drip   { 0% { transform: translateY(-4px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(22px); opacity: 0; } }
    @keyframes sway   { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @media (prefers-reduced-motion: reduce) { .antennae, .sweat, .leaf { animation: none; } }
  </style>

  <!-- 그림자 -->
  <ellipse cx="110" cy="184" rx="78" ry="8" fill="#000" opacity=".25"/>

  <!-- 다리 -->
  <g stroke="#7a3b17" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M92 140 L74 176"/>
    <path d="M106 142 L104 178"/>
    <path d="M118 140 L136 176"/>
    <path d="M70 176 h10 M99 178 h10 M132 176 h10" stroke-width="5"/>
  </g>

  <!-- 더듬이 -->
  <g class="antennae">
    <g stroke="#7a3b17" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M150 68 Q160 46 176 40"/>
      <path d="M134 70 Q128 50 116 44"/>
    </g>
    <circle cx="176" cy="40" r="4.5" fill="#7a3b17"/>
    <circle cx="116" cy="44" r="4.5" fill="#7a3b17"/>
  </g>

  <!-- 몸통: 배, 가슴, 머리 -->
  <circle cx="62" cy="130" r="34" fill="#d9743a"/>
  <circle cx="106" cy="126" r="21" fill="#e0834a"/>
  <circle cx="146" cy="98" r="32" fill="#e8925a"/>

  <!-- 등에 진 나뭇잎 -->
  <g transform="rotate(-22 66 96)">
    <g class="leaf">
      <ellipse cx="66" cy="96" rx="34" ry="15" fill="#4cc38a"/>
      <path d="M34 96 H98" stroke="#2f9e6e" stroke-width="3" stroke-linecap="round"/>
      <path d="M52 96 L60 88 M66 96 L74 88 M52 96 L60 104 M66 96 L74 104" stroke="#2f9e6e" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 안전모 -->
  <path d="M116 90 A30 30 0 0 1 176 90 Z" fill="#ffd23f"/>
  <rect x="110" y="88" width="72" height="9" rx="4.5" fill="#f5b800"/>
  <rect x="140" y="62" width="12" height="10" rx="3" fill="#f5b800"/>

  <!-- 얼굴 -->
  <circle cx="136" cy="106" r="8.5" fill="#fff"/>
  <circle cx="158" cy="106" r="8.5" fill="#fff"/>
  <circle cx="139" cy="107" r="4.2" fill="#2b1b12"/>
  <circle cx="161" cy="107" r="4.2" fill="#2b1b12"/>
  <circle cx="140.5" cy="105.5" r="1.4" fill="#fff"/>
  <circle cx="162.5" cy="105.5" r="1.4" fill="#fff"/>
  <path d="M138 120 Q148 129 160 120" stroke="#7a3b17" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="128" cy="120" r="4.5" fill="#ff8b8b" opacity=".6"/>
  <circle cx="168" cy="120" r="4.5" fill="#ff8b8b" opacity=".6"/>

  <!-- 땀방울 (열심히 일하는 중) -->
  <path class="sweat" d="M190 74 Q197 86 190 92 Q183 86 190 74 Z" fill="#6ec1ff"/>
</svg>
